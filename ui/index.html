<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS - AI Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: grid;
            grid-template-columns: 300px 1fr 300px;
            grid-template-rows: 1fr auto;
            height: 100vh;
            gap: 1px;
            background: #1a1a1f;
        }

        /* SIDEBARS */
        .sidebar {
            background: #0a0a0f;
            border: 1px solid #222;
            overflow-y: auto;
            padding: 20px;
        }

        .sidebar-title {
            color: #00d4ff;
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 14px;
            text-transform: uppercase;
        }

        .sidebar-left { grid-column: 1; grid-row: 1; }
        .sidebar-right { grid-column: 3; grid-row: 1; }

        /* CHAT PANEL */
        .chat-container {
            grid-column: 2;
            grid-row: 1;
            display: flex;
            flex-direction: column;
            background: #0a0a0f;
            border: 1px solid #222;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            display: flex;
            gap: 10px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 8px;
            word-wrap: break-word;
            line-height: 1.4;
        }

        .message.user .message-content {
            background: #00d4ff;
            color: #0a0a0f;
            border-bottom-right-radius: 2px;
        }

        .message.bot .message-content {
            background: #1a1a1f;
            border: 1px solid #00d4ff;
            border-bottom-left-radius: 2px;
        }

        /* TYPING INDICATOR */
        .typing {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #00d4ff;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { opacity: 0.4; transform: translateY(0); }
            40% { opacity: 1; transform: translateY(-10px); }
        }

        /* INPUT AREA */
        .input-area {
            grid-column: 2;
            grid-row: 2;
            padding: 15px 20px;
            display: flex;
            gap: 10px;
            border-top: 1px solid #222;
            background: #0a0a0f;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 15px;
            background: #1a1a1f;
            border: 1px solid #222;
            color: #e0e0e0;
            border-radius: 4px;
            font-family: system-ui;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 8px rgba(0, 212, 255, 0.2);
        }

        button {
            padding: 10px 20px;
            background: #00d4ff;
            color: #0a0a0f;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: bg 0.2s;
        }

        button:hover {
            background: #00b8d4;
        }

        button:disabled {
            background: #0066ff;
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* MEMORY PANEL */
        .search-input {
            width: 100%;
            padding: 8px;
            background: #1a1a1f;
            border: 1px solid #222;
            color: #e0e0e0;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 12px;
        }

        .memory-item {
            background: #1a1a1f;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
            border-left: 2px solid #00d4ff;
            font-size: 12px;
            line-height: 1.4;
        }

        .relevance {
            color: #00d4ff;
            font-size: 11px;
            margin-top: 5px;
        }

        /* STATUS PANEL */
        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
            font-size: 12px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #00d4ff;
        }

        .status-dot.offline {
            background: #ff4444;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-label {
            flex: 1;
            color: #999;
        }

        .status-value {
            color: #00d4ff;
            font-weight: bold;
            font-family: monospace;
        }

        /* SESSION ID */
        .session-id {
            font-size: 10px;
            color: #666;
            margin-top: 10px;
            word-break: break-all;
            font-family: monospace;
        }

        /* ERROR MESSAGE */
        .error {
            background: #ff4444;
            color: white;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
            font-size: 12px;
        }

        .success {
            background: #44ff44;
            color: #0a0a0f;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
            font-size: 12px;
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1a1a1f;
            padding: 30px;
            border-radius: 8px;
            border: 2px solid #00d4ff;
            max-width: 400px;
            text-align: center;
        }

        .modal-title {
            color: #00d4ff;
            font-size: 18px;
            margin-bottom: 15px;
        }

        .modal-risk {
            padding: 10px;
            border-radius: 4px;
            margin: 15px 0;
            font-weight: bold;
        }

        .modal-risk.low {
            background: #44ff44;
            color: #0a0a0f;
        }

        .modal-risk.medium {
            background: #ffaa00;
            color: #0a0a0f;
        }

        .modal-risk.high {
            background: #ff4444;
            color: white;
        }

        .modal-countdown {
            color: #ff4444;
            font-size: 24px;
            margin: 15px 0;
            font-family: monospace;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-buttons button {
            flex: 1;
        }

        /* RESPONSIVE */
        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
            }
            .sidebar-left, .sidebar-right {
                display: none;
            }
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0a0f;
        }

        ::-webkit-scrollbar-thumb {
            background: #00d4ff;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- LEFT SIDEBAR: MEMORY -->
        <div class="sidebar sidebar-left">
            <div class="sidebar-title">Memory</div>
            <input type="text" class="search-input" id="memorySearch" placeholder="Search conversations...">
            <div id="memoryResults"></div>
        </div>

        <!-- CENTER: CHAT -->
        <div class="chat-container">
            <div class="messages" id="messages"></div>
            <div class="input-area">
                <input type="text" id="messageInput" placeholder="Message JARVIS..." autocomplete="off">
                <button id="sendBtn" onclick="sendMessage()">Send</button>
            </div>
        </div>

        <!-- RIGHT SIDEBAR: STATUS -->
        <div class="sidebar sidebar-right">
            <div class="sidebar-title">Status</div>
            <div class="status-item">
                <div class="status-dot" id="ollama-status"></div>
                <div class="status-label">Ollama</div>
                <div class="status-value" id="ollama-text">-</div>
            </div>
            <div class="status-item">
                <div class="status-dot" id="memory-status"></div>
                <div class="status-label">Memory</div>
                <div class="status-value" id="memory-text">-</div>
            </div>
            <div class="status-item">
                <div class="status-label">Model</div>
                <div class="status-value">phi3-mini</div>
            </div>
            <div class="status-item">
                <div class="status-label">Response</div>
                <div class="status-value" id="response-time">-ms</div>
            </div>
            <div class="status-item">
                <div class="status-label">Messages</div>
                <div class="status-value" id="message-count">0</div>
            </div>
            <div class="status-item">
                <div class="status-label">Uptime</div>
                <div class="status-value" id="uptime">-</div>
            </div>
            <div class="session-id">Session: <span id="sessionId"></span></div>
        </div>
    </div>

    <!-- PERMISSION MODAL -->
    <div class="modal" id="permissionModal">
        <div class="modal-content">
            <div class="modal-title" id="modalTitle">Permission Required</div>
            <div id="modalDescription"></div>
            <div class="modal-risk" id="modalRisk"></div>
            <div class="modal-countdown" id="modalCountdown">30</div>
            <div class="modal-buttons">
                <button onclick="denyPermission()" style="background: #ff4444;">DENY</button>
                <button onclick="allowPermission()" style="background: #44ff44; color: #0a0a0f;">ALLOW</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://127.0.0.1:8889';
        let sessionId = generateUUID();
        let messageCount = 0;
        let lastResponseTime = 0;
        let isLoading = false;
        let searchTimeout;

        // Generate UUID for session
        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0;
                const v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        // Initialize session display
        document.getElementById('sessionId').textContent = sessionId.substring(0, 8) + '...';

        // Debounced memory search
        document.getElementById('memorySearch').addEventListener('input', function(e) {
            clearTimeout(searchTimeout);
            const query = e.target.value.trim();
            if (!query) {
                document.getElementById('memoryResults').innerHTML = '';
                return;
            }
            searchTimeout = setTimeout(() => searchMemory(query), 500);
        });

        // Search memory
        async function searchMemory(query) {
            try {
                const response = await fetch(`${API_BASE}/memory/search?q=${encodeURIComponent(query)}&limit=3`);
                if (!response.ok) throw new Error('Search failed');
                
                const data = await response.json();
                const html = data.results.map(r => `
                    <div class="memory-item">
                        ${r.text.substring(0, 100)}...
                        <div class="relevance">Relevance: ${(r.relevance_score * 100).toFixed(0)}%</div>
                    </div>
                `).join('');
                document.getElementById('memoryResults').innerHTML = html || '<div style="color: #666; font-size: 12px;">No results</div>';
            } catch (e) {
                console.error('Memory search error:', e);
            }
        }

        // Send message
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (!message || isLoading) return;

            isLoading = true;
            input.disabled = true;
            document.getElementById('sendBtn').disabled = true;

            // Add user message
            addMessage(message, 'user');
            input.value = '';

            // Add typing indicator
            addTypingIndicator();

            try {
                const startTime = Date.now();
                const response = await fetch(`${API_BASE}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message, session_id: sessionId })
                });

                if (!response.ok) throw new Error('Chat failed');

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let botMessage = '';
                let messageEl = null;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    botMessage += chunk;

                    if (!messageEl) {
                        removeTypingIndicator();
                        messageEl = addMessage(botMessage, 'bot');
                    } else {
                        messageEl.textContent = botMessage;
                        scrollToBottom();
                    }
                }

                lastResponseTime = Date.now() - startTime;
                messageCount++;
                updateStats();
            } catch (e) {
                removeTypingIndicator();
                addMessage(`Error: ${e.message}`, 'error');
            } finally {
                isLoading = false;
                input.disabled = false;
                document.getElementById('sendBtn').disabled = false;
                input.focus();
            }
        }

        // Add message to chat
        function addMessage(text, type) {
            const messagesDiv = document.getElementById('messages');
            const msgEl = document.createElement('div');
            msgEl.className = `message ${type}`;

            const contentEl = document.createElement('div');
            contentEl.className = 'message-content';
            
            if (type === 'error') {
                contentEl.style.background = '#ff4444';
                contentEl.style.color = 'white';
            }
            
            contentEl.textContent = text;
            msgEl.appendChild(contentEl);
            messagesDiv.appendChild(msgEl);
            scrollToBottom();
            return contentEl;
        }

        // Typing indicator
        function addTypingIndicator() {
            const messagesDiv = document.getElementById('messages');
            const msgEl = document.createElement('div');
            msgEl.className = 'message bot';
            msgEl.id = 'typing-indicator';
            msgEl.innerHTML = '<div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
            messagesDiv.appendChild(msgEl);
            scrollToBottom();
        }

        function removeTypingIndicator() {
            const el = document.getElementById('typing-indicator');
            if (el) el.remove();
        }

        // Scroll to bottom
        function scrollToBottom() {
            const messagesDiv = document.getElementById('messages');
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // Update stats
        function updateStats() {
            document.getElementById('response-time').textContent = lastResponseTime + 'ms';
            document.getElementById('message-count').textContent = messageCount;
        }

        // Poll health status
        async function checkHealth() {
            try {
                const response = await fetch(`${API_BASE}/health`);
                if (!response.ok) throw new Error('Health check failed');
                
                const data = await response.json();
                
                const ollamaStatus = document.getElementById('ollama-status');
                ollamaStatus.className = data.ollama ? 'status-dot' : 'status-dot offline';
                document.getElementById('ollama-text').textContent = data.ollama ? 'Online' : 'Offline';

                const memoryStatus = document.getElementById('memory-status');
                memoryStatus.className = data.memory ? 'status-dot' : 'status-dot offline';
                document.getElementById('memory-text').textContent = data.memory ? 'Online' : 'Offline';

                document.getElementById('uptime').textContent = Math.floor(data.uptime_seconds / 60) + 'm';
            } catch (e) {
                console.error('Health check error:', e);
                document.getElementById('ollama-status').className = 'status-dot offline';
                document.getElementById('memory-status').className = 'status-dot offline';
            }
        }

        // Permission modal
        function showPermissionModal(title, description, risk) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalDescription').textContent = description;
            const riskEl = document.getElementById('modalRisk');
            riskEl.textContent = risk;
            riskEl.className = `modal-risk ${risk.toLowerCase()}`;
            document.getElementById('permissionModal').classList.add('active');
            startCountdown();
        }

        function allowPermission() {
            document.getElementById('permissionModal').classList.remove('active');
            addMessage('Permission granted', 'success');
        }

        function denyPermission() {
            document.getElementById('permissionModal').classList.remove('active');
            addMessage('Permission denied', 'error');
        }

        function startCountdown() {
            let count = 30;
            const interval = setInterval(() => {
                document.getElementById('modalCountdown').textContent = count;
                count--;
                if (count < 0) {
                    clearInterval(interval);
                    denyPermission();
                }
            }, 1000);
        }

        // Enter to send
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Initial setup
        checkHealth();
        setInterval(checkHealth, 10000); // Poll every 10 seconds
        document.getElementById('messageInput').focus();
    </script>
</body>
</html>
